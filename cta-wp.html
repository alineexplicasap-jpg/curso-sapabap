    @font-face { font-family: 'Plus Jakarta Sans'; font-style: normal; font-weight: 200 800; font-display: swap; src: url('assets/fonts/plus-jakarta-sans-latin.woff2') format('woff2') }
    @font-face { font-family: 'Playfair Display'; font-style: normal; font-weight: 400 900; font-display: swap; src: url('assets/fonts/playfair-display-latin.woff2') format('woff2') }

    :root { --paper: #f3ecdd; --card: #fbf7ee; --ink: #1a1917; --ink-2: #3a3833; --muted: #6b665b; --gold: #a98124; --gold-2: #c9a24a; --line: rgba(26, 25, 23, .13); --verde: #15803d; --verde-2: #25d366 }
    * { box-sizing: border-box }
    html, body { margin: 0; min-height: 100%; background: var(--paper) }
    body {
      min-height: 100vh; display: grid; place-items: center; padding: 24px;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased;

    }
    .wp {

    }
    .wp__logo { width: 88px; height: 88px; object-fit: contain; margin: 0 auto 18px }
    .wp__marca { margin: 0 0 22px; font-size: .72rem; font-weight: 700; letter-spacing: .32em; color: var(--muted) }
    .wp__icone {
      position: relative; display: grid; place-items: center; width: 76px; height: 76px; margin: 0 auto 22px;
      border-radius: 50%; background: var(--verde-2); color: #fff
    }
    .wp__icone::before, .wp__icone::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--verde-2); animation: wp-onda 2s ease-out infinite }
    .wp__icone::after { animation-delay: 1s }
    .wp__icone svg { width: 40px; height: 40px; fill: currentColor }
    @keyframes wp-onda { 0% { transform: scale(1); opacity: .6 } 100% { transform: scale(1.7); opacity: 0 } }
    .wp__titulo { margin: 0 0 12px; font-family: 'Playfair Display', Georgia, serif; font-weight: 600; font-size: clamp(1.45rem, 5vw, 1.85rem); line-height: 1.2; letter-spacing: -.01em; text-wrap: balance }
    .wp__sub { margin: 0 0 24px; font-size: .95rem; color: var(--ink-2) }
    .wp__barra { height: 6px; margin: 0 auto 28px; max-width: 320px; border-radius: 999px; background: rgba(26, 25, 23, .1); overflow: hidden }
    .wp__barra i { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, var(--gold-2), var(--verde-2)); animation: wp-carga 2s linear forwards }
    @keyframes wp-carga { to { width: 100% } }
    .wp__btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 1.05rem 1.2rem;
      border-radius: 14px; background: var(--verde); color: #fff; text-decoration: none; font-weight: 800; font-size: .86rem; letter-spacing: .05em; line-height: 1.35; text-transform: uppercase;
      box-shadow: 0 10px 24px rgba(21, 128, 61, .3);
      opacity: 0; visibility: hidden; transform: translateY(10px); transition: opacity .35s ease, transform .35s ease, visibility .35s
    }
    .wp__btn svg { flex: none; width: 22px; height: 22px; fill: currentColor }
    .wp__btn:hover { background: #166534 }
    .wp__btn:focus-visible { outline: 3px solid var(--gold-2); outline-offset: 3px }
    .wp.is-pronto .wp__btn { opacity: 1; visibility: visible; transform: none }
    .wp.is-pronto .wp__barra { display: none }
    .wp__nota { margin: 14px 0 0; min-height: 1.2em; font-size: .78rem; color: var(--muted) }
    @media (prefers-reduced-motion: reduce) { .wp__icone::before, .wp__icone::after { animation: none } .wp__barra i { animation-duration: .01s } }

  <script>
    (function () {
      var NUMERO = '5511937255106';
      var ESPERA = 2000;                                   /* ms até abrir o WhatsApp */
      var CHAVE = 'aes_wpp_ts';                            /* evita refazer tudo se a pessoa voltar com "Voltar" */

      function limpa(s) { return String(s || '').replace(/[^a-zA-Z0-9_.~-]/g, '-').slice(0, 60); }
      function nomeDe(p) {                                 /* caminho da página -> nome curto (igual ao do wpp.js) */
        p = String(p || '').replace(/^\/+/, '').replace(/\.html$/, '').replace(/\/+$/, '');
        return p === '' || p === 'index' ? 'lp-atual' : p.replace(/\//g, '-');
      }

      var q = new URLSearchParams(location.search);
      /* ORIGEM: 1) parâmetro ?origem= que o botão envia; 2) página de onde a pessoa veio (referrer); 3) direto */
      var origem = limpa(q.get('origem'));
      if (!origem) { try { var r = new URL(document.referrer); if (r.hostname === location.hostname) origem = limpa(nomeDe(r.pathname)); } catch (e) { } }
      if (!origem) origem = 'direto';
      var posicao = limpa(q.get('pos'));                   /* flutuante | rodape */

      var texto = 'Olá! Vim pelo site e tenho uma dúvida sobre o Curso Prático SAP ABAP. (origem: ' + origem + ')';
      var destino = 'https://wa.me/' + NUMERO + '?text=' + encodeURIComponent(texto);
      var botao = document.getElementById('wp-btn'), cartao = document.getElementById('wp'), nota = document.getElementById('wp-nota');
      botao.href = destino;

      function mostraBotao() { cartao.classList.add('is-pronto'); }

      var voltou = false;
      try { var ts = +sessionStorage.getItem(CHAVE) || 0; voltou = ts && (Date.now() - ts) < 5 * 60 * 1000; } catch (e) { }

      if (voltou) {                                        /* voltou do WhatsApp: não repete o redirecionamento nem o evento */
        mostraBotao();
        nota.textContent = 'Se a conversa já abriu, é só voltar ao WhatsApp.';
        return;
      }

      /* 1) marca a conversão "Contato" já, sem esperar os 2 s (Pixel + servidor, mesmo event_id) */
      var src = {}; try { src = JSON.parse(localStorage.getItem('_aes_src') || '{}'); } catch (e) { }
      var variante = (src.utm_content && /-(lpcompleta|lpcurta)$/.test(src.utm_content)) ? RegExp.$1 : '';
      var parametros = {
        content_name: 'Contato WhatsApp', content_category: 'whatsapp',
        origem_pagina: origem, posicao_botao: posicao || 'desconhecida', canal: 'whatsapp',
        fonte: (window.AES_TRACK && window.AES_TRACK.fonte) || 'direto'
      };
      if (src.utm_campaign) parametros.campanha = src.utm_campaign;
      if (src.utm_content) parametros.anuncio = src.utm_content;
      if (variante) parametros.variante_lp = variante;
      try { if (window.aesTrack) window.aesTrack('Contact', parametros); } catch (e) { }
      try { if (window.clarity) { window.clarity('event', 'whatsapp_contato'); window.clarity('set', 'origem_whatsapp', origem); } } catch (e) { }
      try { sessionStorage.setItem(CHAVE, String(Date.now())); } catch (e) { }

      /* 2) em 2 s abre o WhatsApp e já deixa o botão de segurança à mostra */
      setTimeout(function () {
        mostraBotao();
        location.href = destino;
      }, ESPERA);
    })();
  </script>
