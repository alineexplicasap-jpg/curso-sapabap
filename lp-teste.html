<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Curso Prático SAP ABAP — Aline Explica SAP</title>
  <meta name="robots" content="noindex, nofollow" />
  <!-- Roteador do teste de páginas (A/B: v4 x v4 short). NÃO tem Pixel nem Clarity de propósito: ele só sorteia a versão e
       redireciona. Quem registra PageView, eventos e sessões é a página de destino. Sem JavaScript, cai na v4. -->
  <noscript><meta http-equiv="refresh" content="0;url=/lp-v4.html" /></noscript>
  <style>
    html, body { margin: 0; height: 100%; background: #f3ecdd; color: #3a3833; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif }
    body { display: grid; place-items: center }
    p { margin: 0; letter-spacing: .08em; font-size: .85rem }
  </style>
</head>

<body>
  <p>Carregando…</p>
  <script>
    (function () {
      /* ---- versões do teste (pesos iguais; a LP atual ficou de fora de propósito). Para tirar uma versão, apague a linha dela. ---- */
      var VERSOES = [
        { id: 'v4', caminho: '/lp-v4.html', marca: 'lpv4' },
        { id: 'v4short', caminho: '/lp-v4-short.html', marca: 'lpv4s' }
      ];
      var COOKIE = 'aes_lp_teste', DIAS = 30;

      function porId(id) { for (var i = 0; i < VERSOES.length; i++) if (VERSOES[i].id === id) return VERSOES[i]; return null; }
      function lerCookie() { var m = document.cookie.match(new RegExp('(?:^|; )' + COOKIE + '=([^;]*)')); return m ? decodeURIComponent(m[1]) : ''; }
      function lerLocal() { try { return localStorage.getItem(COOKIE) || ''; } catch (e) { return ''; } }
      function gravar(id) {
        try { document.cookie = COOKIE + '=' + encodeURIComponent(id) + ';max-age=' + (DIAS * 86400) + ';path=/;SameSite=Lax'; } catch (e) { }
        try { localStorage.setItem(COOKIE, id); } catch (e) { }
      }
      function sorteio() {
        var n = VERSOES.length, r;
        try { var b = new Uint32Array(1); crypto.getRandomValues(b); r = b[0] / 4294967296; } catch (e) { r = Math.random(); }
        return VERSOES[Math.min(n - 1, Math.floor(r * n))];
      }

      var q = new URLSearchParams(location.search);
      var forcada = porId(q.get('forcar'));                       /* ?forcar=v4 só para conferir uma versão (não grava) */
      var v = forcada || porId(lerCookie()) || porId(lerLocal()) || sorteio();
      if (!forcada) gravar(v.id);
      q.delete('forcar');

      /* marca a versão no utm_content: o rastreamento repassa à Hotmart como sck = campanha~anuncio-versão */
      var uc = q.get('utm_content');
      q.set('utm_content', uc ? uc + '-' + v.marca : v.marca);
      q.set('lpv', v.id);

      location.replace(v.caminho + '?' + q.toString() + location.hash);
    })();
  </script>
</body>

</html>
